name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The same matrix pull requests run — no hand-copied subset that drifts.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] -- setup-node does not cache unless cache: is set
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      - name: Check published surface
        run: npm run check:package
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: "*.tgz"

  # OIDC trusted publishing: id-token:write is scoped to this job only, and the
  # pre-built tarball is published so no project build scripts run while the
  # token is available. Configure the npm trusted publisher for this repo +
  # workflow on npmjs.com first; publishing stays inert while package.json has
  # "private": true.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] -- setup-node does not cache unless cache: is set
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
      - name: Update npm (trusted publishing needs >= 11.5.1; lts/* may ship older)
        # zizmor: ignore[adhoc-packages] -- upgrading the npm CLI itself, not a project dependency
        run: npm install -g npm@latest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      # Publishes over OIDC and attaches provenance attestations by default.
      # --access public matters only for scoped packages; unscoped ignores it.
      - name: Publish to npm
        run: npm publish ./*.tgz --access public
