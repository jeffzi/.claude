name: Publish

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint rejects $/

  audit:
    permissions:
      contents: read
    uses: ./.github/workflows/audit.yml # zizmor: ignore[self-repository] -- actionlint rejects $/

  publish:
    name: Publish to crates.io
    needs: [ci, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          if [[ "$tag" != "$version" ]]; then
            printf "Tag %s does not match Cargo.toml version %s\n" "$tag" "$version" >&2
            exit 1
          fi
      - name: Authenticate with crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish
        run: cargo publish --locked
