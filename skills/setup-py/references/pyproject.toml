[project]
name = "project"
version = "0.0.0"
description = ""
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jeffzi" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "diff-cover>=10.5,<11",
  "hypothesis>=6.165,<7",
  "prek>=0.5,<0.6",
  "pyrefly>=1.2,<2",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "pytest-randomly>=4.1,<5",
  "pytest-sugar>=1.1,<2",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.16,<0.17",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.31"
exclude-newer = "7 days"
preview-features = ["malware-check"]

[tool.uv.audit]
malware-check = true

[tool.pyrefly]
preset = "strict"
min-severity = "warn"
project-includes = ["src", "tests"]
python-version = "3.12"
search-path = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["ALL", "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501"]
ignore = [
  # --- Docstrings (relaxed for practicality) ---
  "D100", # missing docstring in public module
  "D104", # missing docstring in public package
  "D105", # missing docstring in magic method
  "D107", # missing docstring in __init__ (doc at class level)
  # --- Style preferences ---
  "COM812", # trailing comma (handled by formatter)
  "CPY001", # missing copyright notice (not wanted on every file)
  "G004", # logging f-string (acceptable for modern Python)
]

[tool.ruff.lint.per-file-ignores]
"**/{tests,docs}/*" = ["D101", "D102", "D103", "E402"]
"**/tests/*" = [
  "ANN001",  # missing type annotation for function argument
  "ANN003",  # missing type annotation for **kwargs
  "ANN201",  # missing return type for public function
  "ANN202",  # missing return type for private function
  "ANN204",  # missing return type for special method
  "ANN401",  # dynamically typed expression (Any) — mock/fixture returns
  "ARG001",  # unused function argument (injected fixtures)
  "ARG002",  # unused method argument
  "DOC",     # docstring section checks (fixtures and helpers)
  "FBT001",  # boolean positional arg (parametrize values)
  "INP001",  # implicit namespace package (tests have no __init__.py)
  "PERF401", # manual list comprehension (perf irrelevant in tests)
  "PLR2004", # magic value in comparison (assert x == 42)
  "PLC0415", # import outside top-level (local test imports)
  "PT012",   # pytest.raises block with multiple statements
  "RUF043",  # pytest.raises(match) ambiguous pattern
  "S101",    # use of assert
  "S105",    # hardcoded password string
  "S106",    # hardcoded password argument
  "S108",    # hardcoded temp file path
  "SIM117",  # nested with statements (raises + patch)
  "SLF001",  # private member access
  "TRY301",  # raise within try
  "E501",    # line too long (long fixture data)
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.pydoclint]
style = "google"
# Ruff's DOC501 covers direct raises; propagated errors are documented by review, which pydoclint's
# body-only raise analysis would flag as extraneous.
skip-checking-raises = true
arg-type-hints-in-docstring = false
check-class-attributes = false
check-return-types = false
check-style-mismatch = true
check-yield-types = false

[tool.pymaxlines]
max-lines = 500
max-lines-per-function = 60

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -n auto --cov --cov-report=term-missing"
filterwarnings = ["error"]
strict = true
# A test stuck past this many seconds dumps every thread's stack and exits its
# worker, so a hang fails the run instead of stalling it. Keep it above the
# slowest legitimate test, or that test is killed mid-run.
faulthandler_timeout = 180
faulthandler_exit_on_timeout = true

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.",
  "raise NotImplementedError",
]
fail_under = 90
