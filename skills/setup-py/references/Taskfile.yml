version: "3"

vars:
  CLEAN_PATHS:
    - .coverage
    - .coverage.*
    - .hypothesis
    - .pytest_cache
    - .ruff_cache
    - .venv
    - .venv-*
    - "*.egg-info"
    - coverage.xml
    - dist

tasks:
  default:
    cmds:
      - task --list --sort none
    silent: true

  _require-uv:
    internal: true
    preconditions:
      - sh: command -v uv
        msg: "uv is required — install: https://docs.astral.sh/uv/getting-started/installation/"

  _require-dprint:
    internal: true
    preconditions:
      - sh: command -v dprint
        msg: "dprint is required — install: https://dprint.dev/install/"

  _sync:
    internal: true
    deps: [_require-uv]
    cmds:
      - uv sync --locked --all-extras

  install:
    desc: Sync the project and dev dependencies from the lockfile
    deps: [_sync]
    cmds:
      - uv run prek install

  test:
    desc: "Run the test suite on the default interpreter (pass extra args after --)"
    deps: [_sync]
    cmds:
      - uv run pytest {{if .CLI_ARGS}}--no-cov {{end}}{{.CLI_ARGS}}

  test:matrix:
    desc: Run the test suite on every supported Python version
    deps: [_require-uv]
    vars:
      PYTHONS: [3.12, 3.13, 3.14]
    cmds:
      - for: { var: PYTHONS }
        cmd: >-
          UV_PROJECT_ENVIRONMENT=.venv-{{.ITEM}}
          uv run --python {{.ITEM}} --locked --all-extras pytest

  check:
    desc: Run every pre-commit hook across the repo (fixing hooks rewrite files in place)
    deps: [_sync, _require-dprint]
    vars:
      GIT_FILES:
        sh: git ls-files --cached --others --exclude-standard
      PREK_FILES: "{{range $f := .GIT_FILES | splitLines}}{{$f | shellQuote}} {{end}}"
    cmds:
      - uv run prek run --files {{.PREK_FILES}}

  clean:
    desc: Remove build artifacts, caches, and virtualenvs
    cmds:
      - cmd: rm -rf {{.CLEAN_PATHS | join " "}}
        platforms: [darwin, linux]
      - cmd: >-
          powershell -NoProfile -Command
          "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          -Path {{.CLEAN_PATHS | join ","}}"
        platforms: [windows]
