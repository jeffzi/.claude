name: Update tools

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  autoupdate:
    name: Update dependencies and dev tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the autoupdate branch
      pull-requests: write # open or update the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - name: Upgrade dependencies
        run: |
          uv lock --upgrade
          uv sync
      - uses: ./.github/actions/setup-dprint # zizmor: ignore[self-repository] — actionlint rejects $/
      - name: Bump hook revs and dprint plugins
        run: |
          uv run prek autoupdate
          dprint config update
      - name: Auto-fix and verify
        run: |
          if ! uv run prek run -a; then
            uv run prek run -a --show-diff-on-failure
          fi
      - name: Run tests
        run: uv run pytest --no-cov -x -q
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1 # zizmor: ignore[superfluous-actions]
        with:
          commit-message: "chore: update dependencies and dev tools"
          branch: autoupdate-tools
          title: "chore: update dependencies and dev tools"
          body: Automated update of uv dependencies, prek hook revs, and dprint plugins.
          delete-branch: true
