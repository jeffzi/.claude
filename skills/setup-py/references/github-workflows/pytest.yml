name: Tests

on:
  push:
    branches: [main, fix-ci/**]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  _TYPER_FORCE_DISABLE_TERMINAL: "1"
  PYTEST_ADDOPTS: "--color=yes"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            diff-cover: true
          - os: windows-latest
            pytest-extra: "--no-cov"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history only where diff-cover compares against main
          fetch-depth: ${{ matrix.diff-cover && '0' || '1' }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        env:
          PYTEST_EXTRA: ${{ matrix.pytest-extra || '' }}
        run: |
          # shellcheck disable=SC2086
          uv run pytest $PYTEST_EXTRA

      - name: Check diff coverage
        if: github.event_name == 'pull_request' && matrix.diff-cover
        run: |
          uv run coverage xml
          uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90
