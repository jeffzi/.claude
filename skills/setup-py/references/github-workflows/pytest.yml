name: Tests

on:
  push:
    branches: [main, fix-ci/**, plan/**, "v[0-9]*"]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      patch-artifact:
        description: >-
          Name of an artifact from the calling run that holds `update.patch`, a `git diff --binary`
          applied to the checkout before testing; a caller supplies an upgraded `uv.lock` this way,
          with every other file the upgrade changed. Empty tests the commit as it is.
        type: string
        default: ""

permissions:
  contents: read

# The `tests-` prefix keeps the group distinct from a caller's own: under
# `workflow_call`, `github.workflow` is the caller's name, and a called workflow
# sharing its caller's group cancels the caller.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_ADDOPTS: "--color=yes"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            diff-cover: true
          - os: windows-latest
            pytest-extra: "--no-cov"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history only where diff-cover compares against main
          fetch-depth: ${{ matrix.diff-cover && '0' || '1' }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Download the caller's patch
        if: inputs.patch-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.patch-artifact }}
          path: ${{ runner.temp }}

      - name: Apply the caller's patch
        if: inputs.patch-artifact
        shell: bash
        run: |
          # An empty patch means the caller changed nothing; `git apply` rejects one.
          if [[ -s "$RUNNER_TEMP/update.patch" ]]; then
            git apply "$RUNNER_TEMP/update.patch"
          fi

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        # bash on every runner: pwsh, the Windows default, reads `$PYTEST_EXTRA`
        # as an undefined variable and drops the matrix's `--no-cov`.
        shell: bash
        env:
          PYTEST_EXTRA: ${{ matrix.pytest-extra || '' }}
        run: |
          # shellcheck disable=SC2086
          uv run pytest $PYTEST_EXTRA

      - name: Check diff coverage
        if: github.event_name == 'pull_request' && matrix.diff-cover
        run: |
          uv run coverage xml
          uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90
