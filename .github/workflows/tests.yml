name: tests

on:
  pull_request:
  push:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install bats-core shellcheck shfmt
          else
            # apt ships an old shellcheck (0.9.0 on ubuntu 24.04) whose diagnostics
            # diverge from brew's; install the latest stable release binary so both
            # runners lint with the same codes.
            curl -sSL https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz \
              | tar -xJ && sudo mv shellcheck-stable/shellcheck /usr/local/bin/
            sudo npm install -g bats
            go install mvdan.cc/sh/v3/cmd/shfmt@latest
            echo "$HOME/go/bin" >> "$GITHUB_PATH"
          fi
        shell: bash
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install ils
        # The hooks read shell commands through `ils parse`, which no tagged ils
        # release ships yet: pin the main-branch commit that has it.
        run: |
          go install github.com/jeffzi/ils@a16597797147a0c866b5cfdf816854edb1758134
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Lint
        run: shellcheck -x scripts/statusline.sh tests/helpers/statusline.bash tests/helpers/hooks.bash
      - name: Format
        run: shfmt -d scripts/statusline.sh tests/helpers/statusline.bash tests/helpers/hooks.bash
      - name: Run tests
        run: bats tests/
