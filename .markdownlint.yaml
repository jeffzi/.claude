default: true

# MD013/line-length
MD013:
  line_length: 120
  code_blocks: false
  tables: false

# MD024/no-duplicate-heading - Allow same heading under different parents
MD024:
  siblings_only: true

# MD033/no-inline-html - Allow inline HTML (common in skill docs)
MD033: false

# MD041/first-line-heading - Disable for frontmatter compatibility
MD041: false

# MD046/code-block-style
MD046:
  style: fenced

# MD060/table-column-style - Disable overly strict table alignment
MD060: false
