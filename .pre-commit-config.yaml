default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # Built-in hooks (fast, native Rust)
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  # JSON, YAML, Markdown formatting
  - repo: local
    hooks:
      - id: dprint
        name: dprint
        entry: dprint fmt --diff
        language: system
        types_or: [json, yaml, markdown]

  # Shell formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: ["-w"]

  # Shell linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]

  # Python linting & formatting (pytest suite and setup-py reference scripts only)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(tests|skills/setup-py/references/scripts)/.*\.py$
      - id: ruff-format
        files: ^(tests|skills/setup-py/references/scripts)/.*\.py$

  # Python type checking
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.2.0
    hooks:
      - id: pyrefly-check
        files: ^(tests|skills/setup-py/references/scripts)/.*\.py$
        additional_dependencies: [pytest]

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  # Sync skills from external repos
  - repo: local
    hooks:
      - id: sync-skills
        name: sync skills
        entry: scripts/sync-skills.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Conventional commit messages
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
